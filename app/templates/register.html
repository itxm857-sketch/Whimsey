{% extends 'base.html' %}{% block title %}Create account — Whimsy{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><img src="{{ url_for('static', filename='images/whimsy-logo.jpeg') }}" alt="Whimsy" class="auth-logo"><span class="eyebrow">JOIN WHIMSY</span><h1>Create your account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input required name="name" value="{{ request.form.get('name','') }}"></label><label>Email<input required type="email" name="email" value="{{ request.form.get('email','') }}"></label><label>Phone <span class="muted">(optional)</span><input name="phone" value="{{ request.form.get('phone','') }}"></label><label>Password<input required type="password" name="password" minlength="8"></label><label>Confirm password<input required type="password" name="confirm_password" minlength="8"></label><button class="btn btn-dark full" type="submit">Create account</button></form><p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></section>{% endblock %}
