{% extends 'base.html' %}{% block title %}Log in — Whimsy{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><img src="{{ url_for('static', filename='images/whimsy-logo.jpeg') }}" alt="Whimsy" class="auth-logo"><span class="eyebrow">WELCOME BACK</span><h1>Log in to WHIMSY</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Password<input required type="password" name="password" autocomplete="current-password"></label><button class="btn btn-dark full" type="submit">Log in</button></form><p class="auth-footer">New to WHIMSY? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></section>{% endblock %}
