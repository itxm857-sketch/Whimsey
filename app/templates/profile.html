{% extends 'base.html' %}{% block title %}My Account — Whimsy{% endblock %}{% block content %}<section class="page-hero compact"><div class="container"><span class="eyebrow">MY ACCOUNT</span><h1>Hello, {{ current_user.name.split(' ')[0] }}.</h1></div></section><section class="section"><div class="container account-grid"><div class="form-card"><h2>Profile</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" value="{{ current_user.name }}" required></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>Phone<input name="phone" value="{{ current_user.phone or '' }}"></label><button class="btn btn-dark" type="submit">Save changes</button></form></div><div class="form-card"><h2>Password</h2><form action="{{ url_for('auth.change_password') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" required></label><button class="btn btn-outline" type="submit">Change password</button></form><a class="text-link block-link" href="{{ url_for('orders.list_orders') }}">View my orders →</a><a class="text-link block-link" href="{{ url_for('auth.logout') }}">Log out →</a></div></div></section>{% endblock %}
