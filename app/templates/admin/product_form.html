{% extends 'admin/base.html' %}{% block heading %}{{ 'Edit product' if product else 'Add product' }}{% endblock %}{% block content %}<form class="panel form-panel" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Product name<input required name="name" value="{{ product.name if product else '' }}"></label><label>SKU<input required name="sku" value="{{ product.sku if product else '' }}"></label><label>Price<input required type="number" min="0" step="0.01" name="price" value="{{ product.price if product else '' }}"></label><label>Sale price <span class="muted">(optional)</span><input type="number" min="0" step="0.01" name="sale_price" value="{{ product.sale_price if product and product.sale_price is not none else '' }}"></label><label>Stock<input required type="number" min="0" name="stock" value="{{ product.stock if product else 0 }}"></label><label>Low-stock threshold<input required type="number" min="0" name="low_stock_threshold" value="{{ product.low_stock_threshold if product else 5 }}"></label><label>Category<select name="category_id"><option value="">Uncategorized</option>{% for c in categories %}<option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Image URL <span class="muted">(or upload below)</span><input name="image_url" value="{{ product.image_url if product else '' }}"></label><label class="span-2">Upload image<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><label class="span-2">Additional image URLs <span class="muted">(one URL per line)</span><textarea name="additional_images" rows="4">{{ (product.additional_images or [])|join('\n') if product else '' }}</textarea></label><label class="span-2">Description<textarea name="description" rows="8">{{ product.description if product else '' }}</textarea></label><label class="check"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Featured product</label><label class="check"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Active in store</label></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('admin.products') }}">Cancel</a><button class="btn btn-dark" type="submit">{{ 'Save changes' if product else 'Create product' }}</button></div></form>{% endblock %}
