{% extends 'admin/base.html' %}{% block heading %}Categories{% endblock %}{% block content %}<div class="admin-grid-2"><section class="panel"><div class="panel-head"><h2>New category</h2></div><form class="form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input required name="name"></label><label>Description<textarea name="description" rows="5"></textarea></label><button class="btn btn-dark" type="submit">Create category</button></form></section><section class="panel"><div class="panel-head"><h2>Categories</h2></div>{% for category in categories %}<div class="list-row"><div><strong>{{ category.name }}</strong><span>{{ category.products.count() }} products</span></div><form method="post" action="{{ url_for('admin.delete_category', category_id=category.id) }}" data-confirm="Delete this category? Products will become uncategorized."><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger-link" type="submit">Delete</button></form></div>{% else %}<div class="empty-mini">No categories yet.</div>{% endfor %}</section></div>{% endblock %}
