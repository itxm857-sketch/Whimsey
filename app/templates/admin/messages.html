{% extends 'admin/base.html' %}{% block heading %}Messages{% endblock %}{% block content %}<div class="toolbar"><form class="search-form"><input name="q" value="{{ q }}" placeholder="Search messages"><button class="btn btn-dark">Search</button></form></div><section class="panel"><div class="table-wrap"><table><thead><tr><th></th><th>Subject</th><th>From</th><th>Date</th><th></th></tr></thead><tbody>{% for message in messages %}<tr><td><span class="dot {{ '' if message.is_read else 'unread' }}"></span></td><td><a href="{{ url_for('admin.message_detail', message_id=message.id) }}"><strong>{{ message.subject }}</strong></a></td><td>{{ message.name }}<small>{{ message.email }}</small></td><td>{{ message.created_at.strftime('%d %b %Y') }}</td><td class="actions"><form method="post" action="{{ url_for('admin.toggle_message', message_id=message.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">{{ 'Unread' if message.is_read else 'Read' }}</button></form><form method="post" action="{{ url_for('admin.delete_message', message_id=message.id) }}" data-confirm="Delete this message?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No messages found.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
